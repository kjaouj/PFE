services:
  # ---- Postgres database ----
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: navigator
      POSTGRES_USER: navigator
      POSTGRES_PASSWORD: navigator
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigator"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Ollama ----
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  # ---- Django backend ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-4s#0ucylvvqnz@25y1-@b8-l#^wutb!doduq2odkl3@=iop1ja}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: navigator
      DB_USER: navigator
      DB_PASSWORD: navigator
      DB_HOST: postgres
      DB_PORT: 5432
      CORS_ALLOW_ALL: "True"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - chroma_data:/app/data/chroma
      - media_data:/app/media
    ports:
      - "8000:8000"

  # ---- React frontend ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  chroma_data:
  media_data:
  ollama_data:
