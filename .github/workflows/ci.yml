name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: navigator
          POSTGRES_USER: navigator
          POSTGRES_PASSWORD: navigator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U navigator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: navigator
      DB_USER: navigator
      DB_PASSWORD: navigator
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      CORS_ALLOW_ALL: "True"
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      CHROMA_PERSIST_DIR: data/chroma
      RAG_QA_USE_HYBRID: "True"
      RAG_QA_USE_MULTI_QUERY: "False"
      RAG_QA_USE_RERANKING: "True"
      RAG_QA_TOP_K: 8
      RAG_LLM_MODEL: mistral
      RAG_LLM_NUM_PREDICT: 320
      RAG_LLM_TEMPERATURE: 0.2
      RAG_LLM_NUM_CTX: 4096
      RAG_LLM_KEEP_ALIVE: 30m

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python manage.py test rag.test_api_flows rag.test_citations_and_alignment rag.tests rag.test_resilience -v 2

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "false"
          REACT_APP_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build
